# File: Local-only Mosquitto development profile.
# Purpose: Provide MQTT 5 and persistence for manual adapter exploration.
# Security: The Compose port is bound to loopback. Anonymous access is not for deployment.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
autosave_interval 10

max_packet_size 1048576
max_queued_messages 1000
message_size_limit 262144

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
