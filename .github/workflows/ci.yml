name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.0.0
        with:
          run_install: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify formatting
        run: pnpm format:check

      - name: Run type-aware lint
        run: pnpm lint

      - name: Run unit tests and coverage gates
        run: pnpm test

      - name: Run lifecycle integration campaign
        run: pnpm test:integration

      - name: Build dashboard
        run: pnpm build

      - name: Generate scenario evidence
        run: pnpm scenario

      - name: Run ingestion performance gate
        run: pnpm benchmark

      - name: Upload evidence bundle
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: reliability-evidence-node-24
          path: |
            artifacts/
            coverage/coverage-summary.json
            dist/dashboard/
          if-no-files-found: warn
          retention-days: 14
